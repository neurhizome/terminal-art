<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% feed_meta %}

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- xterm.js for ANSI rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>

    <!-- Expose Jekyll baseurl and load ANSI viewer before body scripts run -->
    <script>window.SITE_BASEURL = {{ site.baseurl | jsonify }};</script>
    <script src="{{ '/assets/js/ansi-viewer.js' | relative_url }}"></script>
    <!-- Inline emphasis processor: [[flags|text]] → styled spans -->
    <script src="{{ '/assets/js/emphasis.js' | relative_url }}"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/sketchbook.css' | relative_url }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="container">
        <header class="site-header">
            <div class="site-wordmark"><a href="{{ '/' | relative_url }}">{{ site.title }}<span class="wordmark-cursor" aria-hidden="true">▤</span></a></div>
            <p class="tagline">{{ site.description }}</p>
            <nav aria-label="Main navigation">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/archive/' | relative_url }}">Archive</a>
                <a href="{{ '/gallery/' | relative_url }}">Gallery</a>
                <a href="{{ '/palette/' | relative_url }}">Palette</a>
                <a href="{{ '/concepts/' | relative_url }}">Concepts</a>
                <a href="{{ '/graph/' | relative_url }}">Graph</a>
                <a href="{{ '/quests/' | relative_url }}">Quests</a>
                <a href="{{ '/cycle/' | relative_url }}">Cycle</a>
                <a href="https://github.com/neurhizome/terminal-art">Repository</a>
            </nav>
        </header>

        <main id="main-content" class="content" tabindex="-1">
            {{ content }}
        </main>

        <footer class="site-footer">
            <p>A shared pen name. A growing collection of encounters.</p>
            <p><a href="{{ '/feed.xml' | relative_url }}">Journal feed</a> · <a href="https://github.com/neurhizome/terminal-art">Source &amp; experiments</a></p>
        </footer>
    </div>

<script>
document.querySelectorAll('.site-header nav a').forEach(function (link) {
    const here = window.location.pathname.replace(/index\.html$/, '').replace(/\/$/, '');
    if (link.origin === window.location.origin && link.pathname.replace(/\/$/, '') === here) {
        link.setAttribute('aria-current', 'page');
    }
});
</script>
</body>
</html>
